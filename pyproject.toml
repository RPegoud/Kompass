[project]
name = "kompass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryan Pégoud", email = "ryan.pegoud@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hydra-core>=1.3.5",
    "modal>=1.5.4",
    "ninja>=1.13.2",
    "numpy>=2.5.2",
    "pyright>=1.1.411",
    "torch>=2.13.0",
    "triton>=3.7.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
extraPaths = ["."]